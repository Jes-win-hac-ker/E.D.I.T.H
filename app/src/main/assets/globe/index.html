<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Wireframe Globe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* Subtle ambient radial vignette */
        .cinematic-haze {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.015) 0%, rgba(10, 15, 24, 0.12) 55%, rgba(0, 0, 0, 0.85) 100%);
        }
    </style>
</head>
<body>
    <div class="cinematic-haze"></div>

    <script src="./three.min.js"></script>
    <script src="./globe.bundle.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const W = window.WireframeGlobe;
            if (!W) return;

            // 1. Scene & Depth Fog
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0016);

            // 2. Camera setup with vertical FOV 45
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);

            // 3. WebGL Renderer configured for high performance on mobile GPU
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
                alpha: false
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;

            const canvas = renderer.domElement;
            canvas.id = 'webgl-canvas';
            document.body.appendChild(canvas);

            // 4. Globe Master Group with 23.4° realistic axial tilt
            const radius = 75;
            const globeGroup = new THREE.Group();
            globeGroup.name = 'minimized-wireframe-globe';
            globeGroup.rotation.z = (23.4 * Math.PI) / 180;
            scene.add(globeGroup);

            // 5. Modular components from your Firefox dashboard
            // A. Neon wireframe graticule (parallels, meridians & depth occluder)
            const graticule = W.createGraticule(radius);
            globeGroup.add(graticule);

            // B. Glowing Fibonacci landmass points & coastlines (23,500 particles)
            const landmass = W.createLandmass(radius);
            globeGroup.add(landmass);

            // C. Day/Night solar terminator shadow boundary
            const solarTerminator = W.createSolarTerminator(radius);
            globeGroup.add(solarTerminator.group);

            // D. Country centroid nodes
            const nodes = W.createNodes(radius);
            globeGroup.add(nodes.group);

            // E. 3D great-circle flight network arcs
            const arcs = W.createArcs(radius);
            globeGroup.add(arcs.group);

            // F. User location beacon
            const userLocation = W.createUserLocationBeacon(radius);
            globeGroup.add(userLocation.group);

            // G. Geodesic pulse manager for radar sweeps
            const geodesicPulse = W.createGeodesicPulseManager({
                radius: radius,
                camera: camera,
                domElement: canvas,
                globeGroup: globeGroup,
                landmass: landmass
            });

            // 6. Touch Drag Interaction (spin & orbit directly with inertia)
            let isDragging = false;
            let prevPointer = { x: 0, y: 0 };
            let rotVelocity = { x: 0, y: 0 };

            function onPointerDown(e) {
                isDragging = true;
                const p = e.touches ? e.touches[0] : e;
                prevPointer = { x: p.clientX, y: p.clientY };
                rotVelocity = { x: 0, y: 0 };
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const p = e.touches ? e.touches[0] : e;
                const dx = p.clientX - prevPointer.x;
                const dy = p.clientY - prevPointer.y;
                prevPointer = { x: p.clientX, y: p.clientY };

                globeGroup.rotation.y += dx * 0.005;
                globeGroup.rotation.x += dy * 0.003;
                rotVelocity = { x: dx * 0.005, y: dy * 0.003 };
            }

            function onPointerUp() {
                isDragging = false;
            }

            canvas.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('touchstart', onPointerDown, { passive: true });
            window.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);

            // 7. Dynamic Scaling: MINIMIZE and fit the globe to the phone screen
            function resize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const aspect = width / height;

                camera.aspect = aspect;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);

                // Fit globe comfortably inside phone screen width (~64% of screen width)
                // Visible width at Z=280: 2 * 280 * tan(22.5 deg) * aspect = 231.9 * aspect
                // Target diameter = 0.64 * 231.9 * aspect = 148.4 * aspect
                // Since base diameter is 150 (2 * 75):
                // scale = (148.4 * aspect) / 150 = 0.99 * aspect
                const scale = Math.min(0.68, Math.max(0.32, aspect * 1.02));
                globeGroup.scale.set(scale, scale, scale);

                // Position globe centered, slightly below the clock bay
                globeGroup.position.set(0, -10, 0);
                camera.position.set(0, 15, 280);
                camera.lookAt(0, -10, 0);
            }

            resize();
            window.addEventListener('resize', resize);

            // Periodic radar pulse expansion every 7 seconds
            setInterval(() => {
                if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function') {
                    geodesicPulse.triggerPulse(new THREE.Vector3(0, 0, 1), null, 3.2);
                }
            }, 7000);

            // 8. 120Hz Animation Loop
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const delta = Math.min(clock.getDelta(), 0.05);
                const elapsed = clock.getElapsedTime();

                // Smooth idle auto-rotation + touch momentum
                if (!isDragging) {
                    globeGroup.rotation.y += delta * 0.12 + rotVelocity.x;
                    globeGroup.rotation.x += rotVelocity.y;
                    rotVelocity.x *= 0.94;
                    rotVelocity.y *= 0.94;
                }

                // Update sub-system visualizers
                if (userLocation && typeof userLocation.update === 'function') userLocation.update(elapsed);
                if (geodesicPulse && typeof geodesicPulse.update === 'function') geodesicPulse.update(elapsed);
                if (solarTerminator && typeof solarTerminator.update === 'function') solarTerminator.update(elapsed);
                if (nodes && typeof nodes.update === 'function') nodes.update(elapsed);
                if (arcs && typeof arcs.update === 'function') arcs.update(elapsed);

                renderer.render(scene, camera);
            }
            animate();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Wireframe Globe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <script src="./three.min.js"></script>
    <script src="./globe.bundle.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const W = window.WireframeGlobe;
            if (!W) return;

            // 1. Scene & Void Space Fog
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0016);

            // 2. Camera setup
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);

            // 3. WebGL Renderer: crisp, dark, anti-aliased with subdued exposure
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
                alpha: false
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 2, 2.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            // Tone down brightness from 1.15 to 0.70 for sleek Stark HUD aesthetic
            renderer.toneMappingExposure = 0.70;

            const canvas = renderer.domElement;
            canvas.id = 'webgl-canvas';
            document.body.appendChild(canvas);

            // 4. Globe Master Group with 23.4° realistic axial tilt
            const radius = 75;
            const globeGroup = new THREE.Group();
            globeGroup.name = 'minimized-wireframe-globe';
            globeGroup.rotation.z = (23.4 * Math.PI) / 180;
            scene.add(globeGroup);
            window.globeGroup = globeGroup;

            // 5. Build Sub-Components
            // A. Neon wireframe graticule
            const graticule = W.createGraticule(radius);
            globeGroup.add(graticule);

            // B. Glowing continent landmass point cloud
            const landmass = W.createLandmass(radius);
            globeGroup.add(landmass);

            // C. Day/Night solar terminator shadow boundary
            const solarTerminator = W.createSolarTerminator(radius);
            globeGroup.add(solarTerminator.group);

            // D. Country centroid nodes
            const nodes = W.createNodes(radius);
            globeGroup.add(nodes.group);

            // E. 3D great-circle flight arcs
            const arcs = W.createArcs(radius);
            globeGroup.add(arcs.group);

            // F. User location beacon
            const userLocation = W.createUserLocationBeacon(radius);
            globeGroup.add(userLocation.group);

            // G. Geodesic pulse manager (only triggered on explicit user tap)
            const geodesicPulse = W.createGeodesicPulseManager({
                radius: radius,
                camera: camera,
                domElement: canvas,
                globeGroup: globeGroup,
                landmass: landmass
            });

            // 6. DE-BLUR & MUTE BRIGHTNESS:
            // Remove blurry haze point duplicates and sharpen particle points into needle-fine dots
            globeGroup.traverse((obj) => {
                if (obj.isPoints) {
                    if (obj.name && obj.name.includes('haze')) {
                        // Completely hide blurry haze layer
                        obj.visible = false;
                    } else if (obj.material) {
                        // Subdued, sharp, crisp dots
                        obj.material.size = 1.1;
                        obj.material.opacity = 0.50;
                        obj.material.transparent = true;
                    }
                }
                if (obj.isLine || obj.isLineSegments) {
                    if (obj.material) {
                        obj.material.opacity = Math.min(obj.material.opacity || 0.2, 0.22);
                    }
                }
            });

            // 7. Dynamic Scaling: MINIMIZE and fit the globe to the phone screen
            function resize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const aspect = width / height;

                camera.aspect = aspect;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);

                // Diameter of globe occupies ~62% of screen width (no edge overflow)
                const scale = Math.min(0.66, Math.max(0.32, aspect * 1.0));
                globeGroup.scale.set(scale, scale, scale);

                // Center globe vertically slightly below the top HUD clock
                globeGroup.position.set(0, -10, 0);
                camera.position.set(0, 15, 280);
                camera.lookAt(0, -10, 0);
            }

            resize();
            window.addEventListener('resize', resize);

            // 8. INTERACTIVE ROTATION ENGINE
            let rotVelocity = { x: 0, y: 0 };
            window.rotateGlobe = function(dx, dy) {
                globeGroup.rotation.y += dx * 0.005;
                globeGroup.rotation.x = Math.max(-0.6, Math.min(0.6, globeGroup.rotation.x + dy * 0.003));
                rotVelocity.x = dx * 0.003;
                rotVelocity.y = dy * 0.0015;
            };

            window.onGlobeTap = function() {
                if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function') {
                    geodesicPulse.triggerPulse(new THREE.Vector3(0, 0, 1), null, 2.2);
                }
            };

            // Touch events directly on canvas
            let isDragging = false;
            let lastPos = { x: 0, y: 0 };

            function onTouchStart(e) {
                isDragging = true;
                const touch = e.touches ? e.touches[0] : e;
                lastPos = { x: touch.clientX, y: touch.clientY };
                rotVelocity = { x: 0, y: 0 };
            }

            function onTouchMove(e) {
                if (!isDragging) return;
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - lastPos.x;
                const dy = touch.clientY - lastPos.y;
                lastPos = { x: touch.clientX, y: touch.clientY };
                window.rotateGlobe(dx, dy);
            }

            function onTouchEnd() {
                isDragging = false;
            }

            canvas.addEventListener('mousedown', onTouchStart);
            window.addEventListener('mousemove', onTouchMove);
            window.addEventListener('mouseup', onTouchEnd);
            canvas.addEventListener('touchstart', onTouchStart, { passive: true });
            window.addEventListener('touchmove', onTouchMove, { passive: true });
            window.addEventListener('touchend', onTouchEnd);

            // 9. Smooth 120Hz Render Loop
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const delta = Math.min(clock.getDelta(), 0.05);
                const elapsed = clock.getElapsedTime();

                // Momentum inertia or gentle ambient orbit
                if (Math.abs(rotVelocity.x) > 0.0001 || Math.abs(rotVelocity.y) > 0.0001) {
                    globeGroup.rotation.y += rotVelocity.x;
                    globeGroup.rotation.x = Math.max(-0.6, Math.min(0.6, globeGroup.rotation.x + rotVelocity.y));
                    rotVelocity.x *= 0.91;
                    rotVelocity.y *= 0.91;
                } else if (!isDragging) {
                    // Very subtle, gentle ambient rotation (0.04)
                    globeGroup.rotation.y += delta * 0.04;
                }

                // Update dynamic sub-systems
                if (userLocation && typeof userLocation.update === 'function') userLocation.update(elapsed);
                if (geodesicPulse && typeof geodesicPulse.update === 'function') geodesicPulse.update(elapsed);
                if (solarTerminator && typeof solarTerminator.update === 'function') solarTerminator.update(elapsed);
                if (nodes && typeof nodes.update === 'function') nodes.update(elapsed);
                if (arcs && typeof arcs.update === 'function') arcs.update(elapsed);

                renderer.render(scene, camera);
            }
            animate();
        });
    </script>
</body>
</html>

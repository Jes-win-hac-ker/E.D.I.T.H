<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Wireframe Globe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <script src="./three.min.js"></script>
    <script src="./globe.bundle.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const W = window.WireframeGlobe;
            if (!W) return;

            // 1. Scene & Deep Void Fog
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0018);

            // 2. Camera setup
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);

            // 3. WebGL Renderer: crisp, dark, 1:1 hardware pixel mapping
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
                alpha: false
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 2, 2.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            // Subdued exposure for stealth holographic HUD aesthetic (never glaring)
            renderer.toneMappingExposure = 0.32;

            const canvas = renderer.domElement;
            canvas.id = 'webgl-canvas';
            document.body.appendChild(canvas);

            // 4. Globe Master Group with 23.4° realistic axial tilt
            const radius = 75;
            const globeGroup = new THREE.Group();
            globeGroup.name = 'minimized-wireframe-globe';
            globeGroup.rotation.z = (23.4 * Math.PI) / 180;
            scene.add(globeGroup);
            window.globeGroup = globeGroup;

            // 5. Build Sub-Components
            // A. Neon wireframe graticule & occluder
            const graticule = W.createGraticule(radius);
            globeGroup.add(graticule);

            // B. Continent landmass point cloud
            const landmass = W.createLandmass(radius);
            globeGroup.add(landmass);

            // C. Day/Night solar terminator shadow boundary
            const solarTerminator = W.createSolarTerminator(radius);
            globeGroup.add(solarTerminator.group);

            // D. Country centroid nodes
            const nodes = W.createNodes(radius);
            globeGroup.add(nodes.group);

            // (3D flight arcs removed per user request)

            // F. Real User Location Beacon (customized to user's real location)
            const userLocation = W.createUserLocationBeacon(radius);
            globeGroup.add(userLocation.group);

            // G. Geodesic pulse manager (only triggered on tap)
            const geodesicPulse = W.createGeodesicPulseManager({
                radius: radius,
                camera: camera,
                domElement: canvas,
                globeGroup: globeGroup,
                landmass: landmass
            });

            // 6. TOTAL DE-BLUR & BRIGHTNESS MUTING:
            // Remove blurry haze point duplicates and sharpen particle points into needle-fine dots
            globeGroup.traverse((obj) => {
                if (obj.isPoints) {
                    if (obj.name && obj.name.includes('haze')) {
                        // Completely hide blurry haze layer
                        obj.visible = false;
                    } else if (obj.material) {
                        // Switch from blurry radial gradient to crisp GPU pixels
                        obj.material.map = null;
                        obj.material.size = 1.0;
                        obj.material.sizeAttenuation = true;
                        // Normal blending prevents additive whiteout blowout
                        obj.material.blending = THREE.NormalBlending;
                        obj.material.opacity = 0.35;
                        obj.material.transparent = true;
                        obj.material.needsUpdate = true;
                    }
                }
                if (obj.isLine || obj.isLineSegments) {
                    if (obj.material) {
                        obj.material.opacity = Math.min(obj.material.opacity || 0.15, 0.16);
                        obj.material.transparent = true;
                    }
                }
                if (obj.isMesh && obj.material) {
                    // Deep black inner occluder
                    obj.material.color.setHex(0x000000);
                }
            });

            // 7. Dynamic Scaling & Search-Active Transitions
            let restingScale = 0.42;
            let targetScale = 0.42;
            let currentScale = 0.42;
            let targetPosY = -10;
            let currentPosY = -10;
            let userZoom = 1.0;
            let searchModeActive = false;
            let targetRotY = 0;
            let targetRotX = 0;
            let userLat = 10.516;
            let userLon = 76.2157;

            function resize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const aspect = width / height;

                camera.aspect = aspect;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);

                // Resting scale fits cleanly below the clock
                restingScale = Math.min(0.48, Math.max(0.32, aspect * 0.95));
                if (!searchModeActive) {
                    targetScale = restingScale;
                }
                camera.position.set(0, 15, 280);
                camera.lookAt(0, -10, 0);
            }

            resize();
            window.addEventListener('resize', resize);

            // 8. REAL USER LOCATION (Defaults to Thrissur, Kerala: 10.516, 76.2157)
            window.setUserLocation = function(lat, lon) {
                userLat = lat;
                userLon = lon;
                if (userLocation && typeof userLocation.setPosition === 'function') {
                    userLocation.setPosition(lat, lon);
                }
                if (W.latLonToVector3) {
                    const localVec = W.latLonToVector3(lat, lon, radius);
                    targetRotY = -Math.atan2(localVec.x, localVec.z);
                    if (!searchModeActive) {
                        globeGroup.rotation.y = targetRotY;
                    }
                }
            };
            window.setUserLocation(10.516, 76.2157);

            // 8B. SEARCH ACTIVE STATE: FILL 60% SCREEN & ALIGN BEACON PERPENDICULAR TO SEARCH
            window.setSearchActive = function(active) {
                searchModeActive = !!active;
                if (searchModeActive) {
                    // Fill 60% of screen width
                    targetScale = 0.60;
                    // Lower position so search bar and floating cards have dedicated stage
                    targetPosY = -28;

                    // Orient Earth so user location beacon (Kerala) is strictly perpendicular to the search bar
                    if (W.latLonToVector3) {
                        const localVec = W.latLonToVector3(userLat, userLon, radius);
                        targetRotY = -Math.atan2(localVec.x, localVec.z);
                        // Subtle upward tilt so beacon points directly perpendicular towards top search header
                        targetRotX = -0.16;
                    }
                } else {
                    targetScale = restingScale;
                    targetPosY = -10;
                    targetRotX = 0;
                }
            };

            // 8C. ZOOM IN / ZOOM OUT CONTROLS
            window.applyZoomDelta = function(factor) {
                userZoom = Math.max(0.4, Math.min(1.85, userZoom * factor));
            };

            window.resetZoom = function() {
                userZoom = 1.0;
            };

            // 9. RAYCASTING: TRIGGER WAVE AT EXACT TOUCH COORDINATES
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            window.triggerWaveAt = function(normX, normY) {
                let ndcX, ndcY;
                if (normX <= 1.0 && normY <= 1.0 && normX >= 0.0 && normY >= 0.0) {
                    ndcX = normX * 2.0 - 1.0;
                    ndcY = -(normY * 2.0 - 1.0);
                } else {
                    ndcX = (normX / window.innerWidth) * 2.0 - 1.0;
                    ndcY = -(normY / window.innerHeight) * 2.0 + 1.0;
                }
                raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);

                const worldCenter = globeGroup.position.clone();
                const worldRadius = radius * globeGroup.scale.x;
                const sphere = new THREE.Sphere(worldCenter, worldRadius);
                const hitPoint = new THREE.Vector3();

                if (raycaster.ray.intersectSphere(sphere, hitPoint)) {
                    const localHit = globeGroup.worldToLocal(hitPoint.clone()).normalize();
                    if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function') {
                        geodesicPulse.triggerPulse(localHit, null, 2.8);
                    }
                } else {
                    const ray = raycaster.ray;
                    const toCenter = worldCenter.clone().sub(ray.origin);
                    const projectionDistance = toCenter.dot(ray.direction);
                    if (projectionDistance > 0) {
                        const closestOnRay = ray.origin.clone().add(ray.direction.clone().multiplyScalar(projectionDistance));
                        const dirFromCenter = closestOnRay.sub(worldCenter).normalize();
                        const surfacePoint = worldCenter.clone().add(dirFromCenter.multiplyScalar(worldRadius));
                        const localHit = globeGroup.worldToLocal(surfacePoint).normalize();
                        if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function') {
                            geodesicPulse.triggerPulse(localHit, null, 2.8);
                        }
                    }
                }
            };

            // 10. INTERACTIVE TOUCH ROTATION WITH MOMENTUM & TWO-FINGER PINCH ZOOM
            let rotVelocity = { x: 0, y: 0 };
            window.rotateGlobe = function(dx, dy) {
                globeGroup.rotation.y += dx * 0.005;
                globeGroup.rotation.x = Math.max(-0.6, Math.min(0.6, globeGroup.rotation.x + dy * 0.003));
                rotVelocity.x = dx * 0.003;
                rotVelocity.y = dy * 0.0015;
            };

            let isDragging = false;
            let lastPos = { x: 0, y: 0 };
            let initialPinchDist = 0;

            function onTouchStart(e) {
                if (e.touches && e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    return;
                }
                isDragging = true;
                const touch = e.touches ? e.touches[0] : e;
                lastPos = { x: touch.clientX, y: touch.clientY };
                rotVelocity = { x: 0, y: 0 };
            }

            function onTouchMove(e) {
                if (e.touches && e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (initialPinchDist > 0) {
                        const factor = dist / initialPinchDist;
                        window.applyZoomDelta(1 + (factor - 1) * 0.5);
                        initialPinchDist = dist;
                    }
                    return;
                }
                if (!isDragging) return;
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - lastPos.x;
                const dy = touch.clientY - lastPos.y;
                lastPos = { x: touch.clientX, y: touch.clientY };
                window.rotateGlobe(dx, dy);
            }

            function onTouchEnd() {
                isDragging = false;
                initialPinchDist = 0;
            }

            canvas.addEventListener('mousedown', onTouchStart);
            window.addEventListener('mousemove', onTouchMove);
            window.addEventListener('mouseup', onTouchEnd);
            canvas.addEventListener('touchstart', onTouchStart, { passive: true });
            window.addEventListener('touchmove', onTouchMove, { passive: true });
            window.addEventListener('touchend', onTouchEnd);

            // 11. 120Hz Animation Loop (Smooth Lerp Transitions & Option A Tether)
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const delta = Math.min(clock.getDelta(), 0.05);
                const elapsed = clock.getElapsedTime();

                // Smooth scale and vertical position transitions
                currentScale = THREE.MathUtils.lerp(currentScale, targetScale, 0.075);
                currentPosY = THREE.MathUtils.lerp(currentPosY, targetPosY, 0.075);

                const effectiveScale = currentScale * userZoom;
                globeGroup.scale.set(effectiveScale, effectiveScale, effectiveScale);
                globeGroup.position.set(0, currentPosY, 0);

                if (searchModeActive) {
                    // Smoothly rotate globe so location beacon aligns perpendicular to the search bar
                    globeGroup.rotation.y = THREE.MathUtils.lerp(globeGroup.rotation.y, targetRotY, 0.08);
                    globeGroup.rotation.x = THREE.MathUtils.lerp(globeGroup.rotation.x, targetRotX, 0.08);
                } else {
                    // Momentum inertia or subtle idle auto-rotation
                    if (Math.abs(rotVelocity.x) > 0.0001 || Math.abs(rotVelocity.y) > 0.0001) {
                        globeGroup.rotation.y += rotVelocity.x;
                        globeGroup.rotation.x = Math.max(-0.6, Math.min(0.6, globeGroup.rotation.x + rotVelocity.y));
                        rotVelocity.x *= 0.91;
                        rotVelocity.y *= 0.91;
                    } else if (!isDragging) {
                        globeGroup.rotation.y += delta * 0.035;
                    }
                }

                // Update sub-systems
                if (userLocation && typeof userLocation.update === 'function') userLocation.update(elapsed);
                if (geodesicPulse && typeof geodesicPulse.update === 'function') geodesicPulse.update(elapsed);
                if (solarTerminator && typeof solarTerminator.update === 'function') solarTerminator.update(elapsed);
                if (nodes && typeof nodes.update === 'function') nodes.update(elapsed);

                renderer.render(scene, camera);
            }
            animate();
        });
    </script>
</body>
</html>

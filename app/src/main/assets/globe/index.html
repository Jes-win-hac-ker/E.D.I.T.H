<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Wireframe Globe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <script src="./three.min.js"></script>
    <script src="./globe.bundle.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const W = window.WireframeGlobe;
            if (!W) return;

            // 1. Scene & Deep Void Fog
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0011);

            // 2. Camera setup
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);

            // 3. WebGL Renderer: crisp, dark, 1:1 hardware pixel mapping
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
                alpha: true
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1.25, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            // Balanced exposure for dark holographic HUD readability (+50% boost)
            renderer.toneMappingExposure = 0.56;

            const canvas = renderer.domElement;
            canvas.id = 'webgl-canvas';
            document.body.appendChild(canvas);

            // 4. Globe Master Group with 23.4° realistic axial tilt
            const radius = 75;
            const axialTiltRad = (23.4 * Math.PI) / 180;
            const globeGroup = new THREE.Group();
            globeGroup.name = 'minimized-wireframe-globe';
            globeGroup.rotation.z = axialTiltRad;
            scene.add(globeGroup);
            window.globeGroup = globeGroup;

            // 5. Build Sub-Components
            // A. Neon wireframe graticule & occluder
            const graticule = W.createGraticule(radius);
            globeGroup.add(graticule);

            function styleLandPoints(points) {
                if (!points || !points.material) return;
                points.material.map = null;
                points.material.size = 1.25;
                points.material.sizeAttenuation = true;
                points.material.blending = THREE.NormalBlending;
                points.material.opacity = 0.62;
                points.material.transparent = true;
                points.material.needsUpdate = true;
            }

            // B. Continent landmass point cloud (styled via onReady once async mask decodes)
            const landmass = W.createLandmass(radius, (points) => {
                styleLandPoints(points);
                queueMicrotask(() => {
                    if (typeof wakeLoop === 'function') wakeLoop(600);
                });
            });
            globeGroup.add(landmass);

            // C. Day/Night solar terminator shadow boundary
            const solarTerminator = W.createSolarTerminator(radius);
            globeGroup.add(solarTerminator.group);

            // D. Country centroid nodes
            const nodes = W.createNodes(radius);
            globeGroup.add(nodes.group);

            // (3D flight arcs removed per user request)

            // F. Real User Location Beacon (customized to user's real location)
            const userLocation = W.createUserLocationBeacon(radius);
            globeGroup.add(userLocation.group);

            // G. Geodesic pulse manager (only triggered on tap)
            const geodesicPulse = W.createGeodesicPulseManager({
                radius: radius,
                camera: camera,
                domElement: canvas,
                globeGroup: globeGroup,
                landmass: landmass
            });

            function isInside(obj, root) {
                let cur = obj;
                while (cur) {
                    if (cur === root) return true;
                    cur = cur.parent;
                }
                return false;
            }

            // 6. TOTAL DE-BLUR & E.D.I.T.H HUD PALETTE COHESION:
            // Remove blurry haze point duplicates, sharpen landmass dots, and apply slate/crimson accents
            globeGroup.traverse((obj) => {
                if (obj.isPoints) {
                    if (obj.name && obj.name.includes('haze')) {
                        // Completely hide blurry haze layer
                        obj.visible = false;
                    } else {
                        styleLandPoints(obj);
                    }
                }
                if (obj.isLine || obj.isLineSegments) {
                    if (obj.material) {
                        if (obj.name === 'graticule-equator') {
                            obj.material.color.setHex(0xE01432);
                            obj.material.blending = THREE.NormalBlending;
                            obj.material.opacity = 0.45;
                            obj.material.transparent = true;
                        } else if (obj.name === 'solar-terminator-line') {
                            obj.material.color.setHex(0xE01432);
                            obj.material.blending = THREE.NormalBlending;
                            obj.material.opacity = 0.52;
                            obj.material.transparent = true;
                        } else if (!isInside(obj, userLocation.group)) {
                            obj.material.color.setHex(0x64748B);
                            obj.material.opacity = Math.min(0.24, Math.max(0.18, (obj.material.opacity || 0.14) * 1.5));
                            obj.material.transparent = true;
                        }
                        if (obj.userData && typeof obj.userData.baseOpacity === 'number') {
                            obj.userData.baseOpacity = obj.material.opacity;
                        }
                    }
                }
                if (obj.isMesh && obj.material) {
                    // Deep black inner occluder
                    obj.material.color.setHex(0x000000);
                }
            });

            // 6B. Crimson Equatorial Tracer Ring for 4-Phase Startup Animation (Option B1)
            const tracerPoints = [];
            const tracerSegments = 128;
            for (let i = 0; i <= tracerSegments; i++) {
                const theta = (i / tracerSegments) * Math.PI * 2;
                tracerPoints.push(new THREE.Vector3(Math.cos(theta) * radius * 1.004, 0, Math.sin(theta) * radius * 1.004));
            }
            const tracerGeo = new THREE.BufferGeometry().setFromPoints(tracerPoints);
            const tracerMat = new THREE.LineBasicMaterial({
                color: 0xE01432,
                transparent: true,
                opacity: 0.92,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const equatorTracerLine = new THREE.Line(tracerGeo, tracerMat);
            equatorTracerLine.name = 'startup-equator-tracer';
            equatorTracerLine.visible = false;
            globeGroup.add(equatorTracerLine);

            // 7. Option 2 Orbital Horizon Arc, Idle Center Showcase & Search Transitions
            let horizonScale = 0.98;
            let horizonPosY = -118;
            let centerScale = 0.46;
            let centerPosY = -10;
            let searchScale = 0.60;
            let targetScale = horizonScale;
            let currentScale = horizonScale;
            let targetPosY = horizonPosY;
            let currentPosY = horizonPosY;
            let hasInitializedPose = false;
            let userZoom = 1.0;
            let searchModeActive = false;
            let ambientCentered = false;
            let settingsBackdropActive = false;
            let currentOccluderOpacity = 1.0;
            let targetOccluderOpacity = 1.0;
            let pendingHorizonSettle = false;
            let poseTransition = null;
            let targetRotY = 0;
            let targetRotX = 0;
            let userLat = 10.516;
            let userLon = 76.2157;
            let startupActive = false;
            let startupStartMs = 0;
            let lastStartupTriggerMs = -1000;
            let startupPulseFired = false;
            let startupScaleMult = 1.0;
            let startupStartRotY = 0;
            let startupEndRotY = 0;

            let isPageHidden = typeof document !== 'undefined' && document.hidden;
            let rafId = null;
            let idleTimerId = null;
            let activeUntilMs = performance.now() + 1400;
            let lastRenderMs = performance.now();
            let elapsed = 0;

            function scheduleNextFrame(delayMs) {
                if (isPageHidden || rafId) return;
                if (delayMs > 0) {
                    if (idleTimerId) return;
                    idleTimerId = setTimeout(() => {
                        idleTimerId = null;
                        if (!isPageHidden && !rafId) {
                            rafId = requestAnimationFrame(animate);
                        }
                    }, delayMs);
                } else {
                    if (idleTimerId) {
                        clearTimeout(idleTimerId);
                        idleTimerId = null;
                    }
                    rafId = requestAnimationFrame(animate);
                }
            }

            function wakeLoop(durationMs) {
                const now = performance.now();
                activeUntilMs = Math.max(activeUntilMs, now + (durationMs || 900));
                if (now - lastRenderMs > 120) {
                    lastRenderMs = now - 16;
                }
                scheduleNextFrame(0);
            }

            function applyTargetPresentation() {
                if (searchModeActive) {
                    targetScale = searchScale;
                    targetPosY = -28;
                    if (W.latLonToVector3) {
                        const localVec = W.latLonToVector3(userLat, userLon, radius);
                        targetRotY = -Math.atan2(localVec.x, localVec.z);
                        targetRotX = -0.16;
                    }
                    wakeLoop(520);
                } else if (ambientCentered) {
                    targetScale = centerScale;
                    targetPosY = centerPosY;
                    targetRotX = 0;
                    wakeLoop(950);
                } else {
                    targetScale = horizonScale;
                    targetPosY = horizonPosY;
                    targetRotX = 0;
                    wakeLoop(950);
                }
            }

            function resize() {
                const width = window.innerWidth || 1;
                const height = window.innerHeight || 1;
                const aspect = width / height;

                camera.aspect = aspect;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);

                const halfH = 280 * Math.tan(THREE.MathUtils.degToRad(45 / 2));
                const apexY = -10 - 0.30 * halfH;

                horizonScale = Math.min(1.22, Math.max(0.86, aspect * 2.18));
                horizonPosY = apexY - radius * horizonScale;

                centerScale = Math.min(0.48, Math.max(0.36, aspect * 1.02));
                centerPosY = -10;

                searchScale = Math.min(0.60, Math.max(0.46, aspect * 1.32));

                camera.position.set(0, 15, 280);
                camera.lookAt(0, -10, 0);

                if (!hasInitializedPose) {
                    hasInitializedPose = true;
                    currentScale = horizonScale;
                    currentPosY = horizonPosY;
                }
                applyTargetPresentation();
            }

            resize();
            window.addEventListener('resize', resize);

            // 8. REAL USER LOCATION (Defaults to Thrissur, Kerala: 10.516, 76.2157)
            window.setUserLocation = function(lat, lon) {
                userLat = lat;
                userLon = lon;
                if (userLocation && typeof userLocation.setPosition === 'function') {
                    userLocation.setPosition(lat, lon);
                }
                if (landmass && typeof landmass.setRadarOrigin === 'function') {
                    landmass.setRadarOrigin(lat, lon);
                }
                if (W.latLonToVector3) {
                    const localVec = W.latLonToVector3(lat, lon, radius);
                    targetRotY = -Math.atan2(localVec.x, localVec.z);
                    startupEndRotY = targetRotY;
                    startupStartRotY = targetRotY - 0.85;
                    if (!searchModeActive && !startupActive) {
                        globeGroup.rotation.y = targetRotY;
                    }
                }
                wakeLoop(800);
            };
            window.setUserLocation(10.516, 76.2157);

            // 8B. SEARCH & AMBIENT CENTER TRANSITIONS
            function startPoseTransition(durMs) {
                const posDelta = Math.abs(targetPosY - currentPosY);
                const scaleDelta = Math.abs(targetScale - currentScale);
                const effectiveDur = (posDelta < 0.5 && scaleDelta < 0.002) ? 0 : durMs;
                poseTransition = {
                    startMs: performance.now(),
                    durationMs: effectiveDur,
                    startScale: currentScale,
                    startPosY: currentPosY,
                    startZoom: userZoom,
                    startRotX: globeGroup.rotation.x,
                };
                wakeLoop(effectiveDur + 160);
            }

            window.setSearchActive = function(active) {
                const next = !!active;
                if (searchModeActive === next) return;
                const wasSearch = searchModeActive;
                searchModeActive = next;
                pendingHorizonSettle = (!next && wasSearch && !ambientCentered);
                applyTargetPresentation();
                startPoseTransition(next ? 520 : 700);
            };

            window.setAmbientCentered = function(centered) {
                const next = !!centered;
                if (ambientCentered === next) return;
                const wasCentered = ambientCentered;
                ambientCentered = next;
                pendingHorizonSettle = wasCentered && !next && !searchModeActive;
                if (!searchModeActive) {
                    applyTargetPresentation();
                    startPoseTransition(700);
                }
            };

            window.setSettingsBackdropActive = function(active) {
                const next = !!active;
                if (settingsBackdropActive === next) return;
                settingsBackdropActive = next;
                targetOccluderOpacity = next ? 0.78 : 1.0;
                wakeLoop(450);
            };

            // 8C. ZOOM IN / ZOOM OUT CONTROLS
            window.applyZoomDelta = function(factor) {
                userZoom = Math.max(0.4, Math.min(1.85, userZoom * factor));
                wakeLoop(1000);
            };

            window.resetZoom = function() {
                userZoom = 1.0;
                wakeLoop(searchModeActive ? 520 : 700);
            };

            // 9. RAYCASTING: TRIGGER WAVE AT EXACT TOUCH COORDINATES
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let lastWaveTriggerMs = 0;

            window.triggerWaveAt = function(normX, normY) {
                const nowMs = performance.now();
                if (nowMs - lastWaveTriggerMs < 180) return;
                lastWaveTriggerMs = nowMs;
                wakeLoop(3000);
                let ndcX, ndcY;
                if (normX <= 1.0 && normY <= 1.0 && normX >= 0.0 && normY >= 0.0) {
                    ndcX = normX * 2.0 - 1.0;
                    ndcY = -(normY * 2.0 - 1.0);
                } else {
                    ndcX = (normX / window.innerWidth) * 2.0 - 1.0;
                    ndcY = -(normY / window.innerHeight) * 2.0 + 1.0;
                }
                raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);

                const worldCenter = globeGroup.position.clone();
                const worldRadius = radius * globeGroup.scale.x;
                const sphere = new THREE.Sphere(worldCenter, worldRadius);
                const hitPoint = new THREE.Vector3();

                if (raycaster.ray.intersectSphere(sphere, hitPoint)) {
                    const localHit = globeGroup.worldToLocal(hitPoint.clone()).normalize();
                    if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function') {
                        geodesicPulse.triggerPulse(localHit, null, 2.8);
                    }
                } else {
                    const ray = raycaster.ray;
                    const toCenter = worldCenter.clone().sub(ray.origin);
                    const projectionDistance = toCenter.dot(ray.direction);
                    if (projectionDistance > 0) {
                        const closestOnRay = ray.origin.clone().add(ray.direction.clone().multiplyScalar(projectionDistance));
                        const dirFromCenter = closestOnRay.sub(worldCenter).normalize();
                        const surfacePoint = worldCenter.clone().add(dirFromCenter.multiplyScalar(worldRadius));
                        const localHit = globeGroup.worldToLocal(surfacePoint).normalize();
                        if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function') {
                            geodesicPulse.triggerPulse(localHit, null, 2.8);
                        }
                    }
                }
            };

            // 10. INTERACTIVE TOUCH ROTATION WITH MOMENTUM & TWO-FINGER PINCH ZOOM
            let rotVelocity = { x: 0, y: 0 };

            function clamp01(v) {
                return Math.max(0, Math.min(1, v));
            }

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            function notifyStartupComplete() {
                if (window.EdithGlobeBridge && typeof window.EdithGlobeBridge.onStartupComplete === 'function') {
                    window.EdithGlobeBridge.onStartupComplete();
                }
            }

            function completeStartupVisuals() {
                startupActive = false;
                startupScaleMult = 1.0;
                globeGroup.rotation.z = axialTiltRad;
                equatorTracerLine.visible = false;
                if (graticule && typeof graticule.setRibsProgress === 'function') {
                    graticule.setRibsProgress(1, 1);
                }
                const settledOccluderOpacity = settingsBackdropActive ? 0.78 : 1.0;
                currentOccluderOpacity = settledOccluderOpacity;
                targetOccluderOpacity = settledOccluderOpacity;
                if (graticule && typeof graticule.setOccluderActive === 'function') {
                    graticule.setOccluderActive(true, settledOccluderOpacity);
                }
                if (landmass && typeof landmass.setRadarSweep === 'function') {
                    landmass.setRadarSweep(10.0);
                }
                if (solarTerminator && solarTerminator.group) solarTerminator.group.visible = true;
                if (nodes && nodes.group) nodes.group.visible = true;
                if (userLocation && userLocation.group) userLocation.group.visible = true;
                wakeLoop(120);
                notifyStartupComplete();
            }

            window.finishStartupAnimation = function() {
                if (startupActive) {
                    completeStartupVisuals();
                } else {
                    notifyStartupComplete();
                }
            };

            window.triggerStartupAnimation = function() {
                const nowMs = performance.now();
                if (nowMs - lastStartupTriggerMs < 400) return;
                lastStartupTriggerMs = nowMs;

                startupActive = true;
                startupStartMs = nowMs;
                startupPulseFired = false;
                startupScaleMult = 0.22;

                rotVelocity.x = 0;
                rotVelocity.y = 0;

                if (W.latLonToVector3) {
                    const localVec = W.latLonToVector3(userLat, userLon, radius);
                    startupEndRotY = -Math.atan2(localVec.x, localVec.z);
                    startupStartRotY = startupEndRotY - 0.85;
                    if (!searchModeActive) {
                        globeGroup.rotation.y = startupStartRotY;
                        globeGroup.rotation.x = 0;
                    }
                }
                globeGroup.rotation.z = 0;

                if (graticule && typeof graticule.setRibsProgress === 'function') {
                    graticule.setRibsProgress(0, 0);
                }
                if (graticule && typeof graticule.setOccluderActive === 'function') {
                    graticule.setOccluderActive(true, 0.15);
                }
                if (landmass && typeof landmass.setRadarOrigin === 'function') {
                    landmass.setRadarOrigin(userLat, userLon);
                }
                if (landmass && typeof landmass.setRadarSweep === 'function') {
                    landmass.setRadarSweep(-0.05);
                }

                if (solarTerminator && solarTerminator.group) solarTerminator.group.visible = false;
                if (nodes && nodes.group) nodes.group.visible = false;
                if (userLocation && userLocation.group) userLocation.group.visible = false;

                equatorTracerLine.visible = true;
                tracerMat.opacity = 0.92;
                tracerGeo.setDrawRange(0, 2);

                wakeLoop(2400);
            };
            window.rotateGlobe = function(dx, dy) {
                globeGroup.rotation.y += dx * 0.005;
                globeGroup.rotation.x = Math.max(-0.6, Math.min(0.6, globeGroup.rotation.x + dy * 0.003));
                rotVelocity.x = dx * 0.003;
                rotVelocity.y = dy * 0.0015;
                wakeLoop(1200);
            };

            let isDragging = false;
            let lastPos = { x: 0, y: 0 };
            let initialPinchDist = 0;

            function onTouchStart(e) {
                wakeLoop(1200);
                if (e.touches && e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    return;
                }
                isDragging = true;
                const touch = e.touches ? e.touches[0] : e;
                lastPos = { x: touch.clientX, y: touch.clientY };
                rotVelocity = { x: 0, y: 0 };
            }

            function onTouchMove(e) {
                if (e.touches && e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (initialPinchDist > 0) {
                        const factor = dist / initialPinchDist;
                        window.applyZoomDelta(1 + (factor - 1) * 0.5);
                        initialPinchDist = dist;
                    }
                    return;
                }
                if (!isDragging) return;
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - lastPos.x;
                const dy = touch.clientY - lastPos.y;
                lastPos = { x: touch.clientX, y: touch.clientY };
                window.rotateGlobe(dx, dy);
            }

            function onTouchEnd() {
                isDragging = false;
                initialPinchDist = 0;
            }

            // Input is routed exclusively through Compose + GlobeController to prevent duplicate waves.

            // 11. Adaptive Animation Loop (Full 90/120Hz on motion/waves; true 30fps timer idle; paused behind console blur)
            function animate(now) {
                rafId = null;
                if (isPageHidden) {
                    return;
                }

                const rawNow = typeof now === 'number' ? now : performance.now();
                const scaleGap = Math.abs(targetScale - currentScale);
                const posGap = Math.abs(targetPosY - currentPosY);
                const zoomGap = ambientCentered ? Math.abs(1.0 - userZoom) : 0;
                const rotGap = searchModeActive
                    ? Math.abs(targetRotY - globeGroup.rotation.y) + Math.abs(targetRotX - globeGroup.rotation.x)
                    : 0;
                const hasInertia = !searchModeActive && (Math.abs(rotVelocity.x) > 0.0001 || Math.abs(rotVelocity.y) > 0.0001);
                const hasActiveMotion = startupActive || isDragging || hasInertia || poseTransition !== null || scaleGap > 0.0008 || posGap > 0.04 || zoomGap > 0.001 || rotGap > 0.002 || rawNow < activeUntilMs;

                if (searchModeActive && !hasActiveMotion) {
                    return;
                }

                if (!hasActiveMotion) {
                    const sinceLast = rawNow - lastRenderMs;
                    if (sinceLast < 32) {
                        scheduleNextFrame(Math.ceil(32 - sinceLast));
                        return;
                    }
                }

                const dt = Math.min(Math.max((rawNow - lastRenderMs) * 0.001, 0.001), 0.08);
                lastRenderMs = rawNow;
                elapsed += dt;

                if (startupActive) {
                    const st = Math.max(0, (rawNow - startupStartMs) * 0.001);

                    // Phase 1 (0.00s - 0.45s): Equatorial crimson tracer + axial tilt (0.00s - 0.65s)
                    const p1Trace = easeOutCubic(clamp01(st / 0.45));
                    const p1Tilt = easeInOutCubic(clamp01(st / 0.65));
                    globeGroup.rotation.z = axialTiltRad * p1Tilt;

                    if (!isDragging && !searchModeActive) {
                        const pRot = easeOutCubic(clamp01(st / 1.65));
                        globeGroup.rotation.y = THREE.MathUtils.lerp(startupStartRotY, startupEndRotY, pRot);
                    }

                    if (st < 0.55) {
                        startupScaleMult = THREE.MathUtils.lerp(0.22, 1.06, easeOutCubic(clamp01(st / 0.55)));
                    } else if (st < 1.55) {
                        startupScaleMult = 1.06;
                    } else {
                        startupScaleMult = THREE.MathUtils.lerp(1.06, 1.0, easeOutCubic(clamp01((st - 1.55) / 0.55)));
                    }

                    // Phase 2 (0.35s - 1.15s): Simultaneous Latitude & Longitude Wireframe Unfold
                    const p2 = clamp01((st - 0.35) / 0.80);
                    const pLat = easeOutCubic(p2);
                    const pLon = easeInOutCubic(p2);
                    if (graticule && typeof graticule.setRibsProgress === 'function') {
                        graticule.setRibsProgress(pLat, pLon);
                    }
                    if (graticule && typeof graticule.setOccluderActive === 'function') {
                        const startupOccluderOpacity = THREE.MathUtils.lerp(0.15, settingsBackdropActive ? 0.78 : 1.0, pLat);
                        currentOccluderOpacity = startupOccluderOpacity;
                        graticule.setOccluderActive(true, startupOccluderOpacity);
                    }

                    if (st <= 0.45) {
                        equatorTracerLine.visible = true;
                        tracerMat.opacity = 0.92;
                        tracerGeo.setDrawRange(0, Math.max(2, Math.floor(p1Trace * 129)));
                    } else if (st <= 1.00) {
                        const fadeOut = clamp01((st - 0.45) / 0.55);
                        tracerGeo.setDrawRange(0, 129);
                        tracerMat.opacity = 0.92 * (1.0 - fadeOut);
                    } else {
                        equatorTracerLine.visible = false;
                    }

                    // Phase 3 (0.85s - 1.85s): Origin-Out Crimson Continent Radar Sweep
                    if (st >= 0.85) {
                        const p3 = clamp01((st - 0.85) / 1.00);
                        const sweepAngle = easeInOutCubic(p3) * (Math.PI + 0.42);
                        if (landmass && typeof landmass.setRadarSweep === 'function') {
                            landmass.setRadarSweep(sweepAngle);
                        }
                    }

                    // Phase 4 (1.55s - 2.10s): Beacon, Terminator & Origin Lock-In
                    if (st >= 1.55) {
                        if (solarTerminator && solarTerminator.group) solarTerminator.group.visible = true;
                        if (nodes && nodes.group) nodes.group.visible = true;
                        if (userLocation && userLocation.group) userLocation.group.visible = true;
                    }
                    if (st >= 1.60 && !startupPulseFired) {
                        startupPulseFired = true;
                        if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function' && W.latLonToVector3) {
                            const originDir = W.latLonToVector3(userLat, userLon, 1.0).normalize();
                            geodesicPulse.triggerPulse(originDir, null, 1.25);
                        }
                    }

                    if (st >= 2.10) {
                        completeStartupVisuals();
                    }
                }

                const step60 = Math.max(0.25, Math.min(dt * 60, 2.0));
                const lerpT = 1 - Math.pow(0.925, step60);
                let notifyHorizonSettledNow = false;
                if (poseTransition !== null) {
                    const u = poseTransition.durationMs <= 0
                        ? 1
                        : clamp01((rawNow - poseTransition.startMs) / poseTransition.durationMs);
                    const eased = easeInOutCubic(u);
                    currentScale = THREE.MathUtils.lerp(poseTransition.startScale, targetScale, eased);
                    currentPosY = THREE.MathUtils.lerp(poseTransition.startPosY, targetPosY, eased);
                    if (ambientCentered) {
                        userZoom = THREE.MathUtils.lerp(poseTransition.startZoom, 1.0, eased);
                    }
                    if (!searchModeActive && !isDragging) {
                        globeGroup.rotation.x = THREE.MathUtils.lerp(poseTransition.startRotX, targetRotX, eased);
                    }
                    if (u >= 1) {
                        currentScale = targetScale;
                        currentPosY = targetPosY;
                        if (ambientCentered) userZoom = 1.0;
                        if (!searchModeActive && !isDragging) globeGroup.rotation.x = targetRotX;
                        poseTransition = null;
                        if (pendingHorizonSettle && !ambientCentered && !searchModeActive) {
                            pendingHorizonSettle = false;
                            notifyHorizonSettledNow = true;
                        }
                    }
                } else {
                    currentScale = THREE.MathUtils.lerp(currentScale, targetScale, lerpT);
                    currentPosY = THREE.MathUtils.lerp(currentPosY, targetPosY, lerpT);
                    if (ambientCentered && Math.abs(1.0 - userZoom) > 0.001) {
                        userZoom = THREE.MathUtils.lerp(userZoom, 1.0, lerpT);
                        if (Math.abs(1.0 - userZoom) <= 0.001) userZoom = 1.0;
                    }
                }

                const effectiveScale = currentScale * userZoom * startupScaleMult;
                globeGroup.scale.set(effectiveScale, effectiveScale, effectiveScale);
                globeGroup.position.set(0, currentPosY, 0);

                if (searchModeActive) {
                    const searchT = 1 - Math.pow(0.92, step60);
                    globeGroup.rotation.y = THREE.MathUtils.lerp(globeGroup.rotation.y, targetRotY, searchT);
                    globeGroup.rotation.x = THREE.MathUtils.lerp(globeGroup.rotation.x, targetRotX, searchT);
                } else {
                    if (Math.abs(rotVelocity.x) > 0.0001 || Math.abs(rotVelocity.y) > 0.0001) {
                        globeGroup.rotation.y += rotVelocity.x * step60;
                        globeGroup.rotation.x = Math.max(-0.6, Math.min(0.6, globeGroup.rotation.x + rotVelocity.y * step60));
                        const decay = Math.pow(0.91, step60);
                        rotVelocity.x *= decay;
                        rotVelocity.y *= decay;
                        if (Math.abs(rotVelocity.x) <= 0.0001) rotVelocity.x = 0;
                        if (Math.abs(rotVelocity.y) <= 0.0001) rotVelocity.y = 0;
                    } else if (!isDragging && !startupActive) {
                        globeGroup.rotation.y += dt * 0.035;
                    }
                }

                // Smoothly transition inner-depth-occluder opacity when settings backdrop is active
                if (!startupActive && Math.abs(targetOccluderOpacity - currentOccluderOpacity) > 0.001) {
                    const occluderLerpT = 1 - Math.pow(0.84, step60);
                    currentOccluderOpacity = THREE.MathUtils.lerp(currentOccluderOpacity, targetOccluderOpacity, occluderLerpT);
                    if (Math.abs(targetOccluderOpacity - currentOccluderOpacity) <= 0.002) {
                        currentOccluderOpacity = targetOccluderOpacity;
                    }
                    if (graticule && typeof graticule.setOccluderActive === 'function') {
                        graticule.setOccluderActive(true, currentOccluderOpacity);
                    }
                }

                // Update sub-systems
                if (userLocation && typeof userLocation.update === 'function') userLocation.update(elapsed);
                if (geodesicPulse && typeof geodesicPulse.update === 'function') geodesicPulse.update(elapsed);
                if (solarTerminator && typeof solarTerminator.update === 'function') solarTerminator.update(elapsed);
                if (nodes && typeof nodes.update === 'function') nodes.update(elapsed);

                renderer.render(scene, camera);

                if (notifyHorizonSettledNow && window.EdithGlobeBridge && typeof window.EdithGlobeBridge.onHorizonSettled === 'function') {
                    window.EdithGlobeBridge.onHorizonSettled();
                }

                const keepFast = startupActive || isDragging || poseTransition !== null ||
                    (!startupActive && Math.abs(targetOccluderOpacity - currentOccluderOpacity) > 0.001) ||
                    (!searchModeActive && (Math.abs(rotVelocity.x) > 0.0001 || Math.abs(rotVelocity.y) > 0.0001)) ||
                    Math.abs(targetScale - currentScale) > 0.0008 ||
                    Math.abs(targetPosY - currentPosY) > 0.04 ||
                    (ambientCentered && Math.abs(1.0 - userZoom) > 0.001) ||
                    (searchModeActive && (Math.abs(targetRotY - globeGroup.rotation.y) + Math.abs(targetRotX - globeGroup.rotation.x)) > 0.002) ||
                    performance.now() < activeUntilMs;
                if (searchModeActive && !keepFast) {
                    return;
                }
                scheduleNextFrame(keepFast ? 0 : 32);
            }

            if (typeof document !== 'undefined') {
                document.addEventListener('visibilitychange', () => {
                    isPageHidden = document.hidden;
                    if (isPageHidden) {
                        if (rafId) {
                            cancelAnimationFrame(rafId);
                            rafId = null;
                        }
                        if (idleTimerId) {
                            clearTimeout(idleTimerId);
                            idleTimerId = null;
                        }
                    } else {
                        wakeLoop(800);
                    }
                });
            }

            window.triggerStartupAnimation();
        });
    </script>
</body>
</html>

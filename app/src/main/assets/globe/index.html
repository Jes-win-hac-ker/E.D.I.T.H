<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Wireframe Globe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <script src="./three.min.js"></script>
    <script src="./globe.bundle.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const W = window.WireframeGlobe;
            if (!W) return;

            // 1. Scene & Deep Void Fog
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0011);

            // 2. Camera setup
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);

            // 3. WebGL Renderer: crisp, dark, 1:1 hardware pixel mapping
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
                alpha: false
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1.5, 1.75));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            // Balanced exposure for dark holographic HUD readability (+50% boost)
            renderer.toneMappingExposure = 0.56;

            const canvas = renderer.domElement;
            canvas.id = 'webgl-canvas';
            document.body.appendChild(canvas);

            // 4. Globe Master Group with 23.4° realistic axial tilt
            const radius = 75;
            const globeGroup = new THREE.Group();
            globeGroup.name = 'minimized-wireframe-globe';
            globeGroup.rotation.z = (23.4 * Math.PI) / 180;
            scene.add(globeGroup);
            window.globeGroup = globeGroup;

            // 5. Build Sub-Components
            // A. Neon wireframe graticule & occluder
            const graticule = W.createGraticule(radius);
            globeGroup.add(graticule);

            function styleLandPoints(points) {
                if (!points || !points.material) return;
                points.material.map = null;
                points.material.size = 1.25;
                points.material.sizeAttenuation = true;
                points.material.blending = THREE.NormalBlending;
                points.material.opacity = 0.62;
                points.material.transparent = true;
                points.material.needsUpdate = true;
            }

            // B. Continent landmass point cloud (styled via onReady once async mask decodes)
            const landmass = W.createLandmass(radius, (points) => {
                styleLandPoints(points);
                queueMicrotask(() => {
                    if (typeof wakeLoop === 'function') wakeLoop(600);
                });
            });
            globeGroup.add(landmass);

            // C. Day/Night solar terminator shadow boundary
            const solarTerminator = W.createSolarTerminator(radius);
            globeGroup.add(solarTerminator.group);

            // D. Country centroid nodes
            const nodes = W.createNodes(radius);
            globeGroup.add(nodes.group);

            // (3D flight arcs removed per user request)

            // F. Real User Location Beacon (customized to user's real location)
            const userLocation = W.createUserLocationBeacon(radius);
            globeGroup.add(userLocation.group);

            // G. Geodesic pulse manager (only triggered on tap)
            const geodesicPulse = W.createGeodesicPulseManager({
                radius: radius,
                camera: camera,
                domElement: canvas,
                globeGroup: globeGroup,
                landmass: landmass
            });

            function isInside(obj, root) {
                let cur = obj;
                while (cur) {
                    if (cur === root) return true;
                    cur = cur.parent;
                }
                return false;
            }

            // 6. TOTAL DE-BLUR & E.D.I.T.H HUD PALETTE COHESION:
            // Remove blurry haze point duplicates, sharpen landmass dots, and apply slate/crimson accents
            globeGroup.traverse((obj) => {
                if (obj.isPoints) {
                    if (obj.name && obj.name.includes('haze')) {
                        // Completely hide blurry haze layer
                        obj.visible = false;
                    } else {
                        styleLandPoints(obj);
                    }
                }
                if (obj.isLine || obj.isLineSegments) {
                    if (obj.material) {
                        if (obj.name === 'graticule-equator') {
                            obj.material.color.setHex(0xE01432);
                            obj.material.blending = THREE.NormalBlending;
                            obj.material.opacity = 0.45;
                            obj.material.transparent = true;
                        } else if (obj.name === 'solar-terminator-line') {
                            obj.material.color.setHex(0xE01432);
                            obj.material.blending = THREE.NormalBlending;
                            obj.material.opacity = 0.52;
                            obj.material.transparent = true;
                        } else if (!isInside(obj, userLocation.group)) {
                            obj.material.color.setHex(0x64748B);
                            obj.material.opacity = Math.min(0.24, Math.max(0.18, (obj.material.opacity || 0.14) * 1.5));
                            obj.material.transparent = true;
                        }
                    }
                }
                if (obj.isMesh && obj.material) {
                    // Deep black inner occluder
                    obj.material.color.setHex(0x000000);
                }
            });

            // 7. Option 2 Orbital Horizon Arc, Idle Center Showcase & Search Transitions
            let horizonScale = 0.98;
            let horizonPosY = -118;
            let centerScale = 0.46;
            let centerPosY = -10;
            let searchScale = 0.60;
            let targetScale = horizonScale;
            let currentScale = horizonScale;
            let targetPosY = horizonPosY;
            let currentPosY = horizonPosY;
            let hasInitializedPose = false;
            let userZoom = 1.0;
            let searchModeActive = false;
            let ambientCentered = false;
            let targetRotY = 0;
            let targetRotX = 0;
            let userLat = 10.516;
            let userLon = 76.2157;

            let isPageHidden = typeof document !== 'undefined' && document.hidden;
            let rafId = null;
            let idleTimerId = null;
            let activeUntilMs = performance.now() + 1400;
            let lastRenderMs = performance.now();
            let elapsed = 0;

            function scheduleNextFrame(delayMs) {
                if (isPageHidden || rafId) return;
                if (delayMs > 0) {
                    if (idleTimerId) return;
                    idleTimerId = setTimeout(() => {
                        idleTimerId = null;
                        if (!isPageHidden && !rafId) {
                            rafId = requestAnimationFrame(animate);
                        }
                    }, delayMs);
                } else {
                    if (idleTimerId) {
                        clearTimeout(idleTimerId);
                        idleTimerId = null;
                    }
                    rafId = requestAnimationFrame(animate);
                }
            }

            function wakeLoop(durationMs) {
                const now = performance.now();
                activeUntilMs = Math.max(activeUntilMs, now + (durationMs || 900));
                if (now - lastRenderMs > 120) {
                    lastRenderMs = now - 16;
                }
                scheduleNextFrame(0);
            }

            function applyTargetPresentation() {
                if (searchModeActive) {
                    targetScale = searchScale;
                    targetPosY = -28;
                    if (W.latLonToVector3) {
                        const localVec = W.latLonToVector3(userLat, userLon, radius);
                        targetRotY = -Math.atan2(localVec.x, localVec.z);
                        targetRotX = -0.16;
                    }
                    wakeLoop(520);
                } else if (ambientCentered) {
                    targetScale = centerScale;
                    targetPosY = centerPosY;
                    targetRotX = 0;
                    wakeLoop(950);
                } else {
                    targetScale = horizonScale;
                    targetPosY = horizonPosY;
                    targetRotX = 0;
                    wakeLoop(950);
                }
            }

            function resize() {
                const width = window.innerWidth || 1;
                const height = window.innerHeight || 1;
                const aspect = width / height;

                camera.aspect = aspect;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);

                const halfH = 280 * Math.tan(THREE.MathUtils.degToRad(45 / 2));
                const apexY = -10 - 0.30 * halfH;

                horizonScale = Math.min(1.22, Math.max(0.86, aspect * 2.18));
                horizonPosY = apexY - radius * horizonScale;

                centerScale = Math.min(0.48, Math.max(0.36, aspect * 1.02));
                centerPosY = -10;

                searchScale = Math.min(0.60, Math.max(0.46, aspect * 1.32));

                camera.position.set(0, 15, 280);
                camera.lookAt(0, -10, 0);

                if (!hasInitializedPose) {
                    hasInitializedPose = true;
                    currentScale = horizonScale;
                    currentPosY = horizonPosY;
                }
                applyTargetPresentation();
            }

            resize();
            window.addEventListener('resize', resize);

            // 8. REAL USER LOCATION (Defaults to Thrissur, Kerala: 10.516, 76.2157)
            window.setUserLocation = function(lat, lon) {
                userLat = lat;
                userLon = lon;
                if (userLocation && typeof userLocation.setPosition === 'function') {
                    userLocation.setPosition(lat, lon);
                }
                if (W.latLonToVector3) {
                    const localVec = W.latLonToVector3(lat, lon, radius);
                    targetRotY = -Math.atan2(localVec.x, localVec.z);
                    if (!searchModeActive) {
                        globeGroup.rotation.y = targetRotY;
                    }
                }
                wakeLoop(800);
            };
            window.setUserLocation(10.516, 76.2157);

            // 8B. SEARCH & AMBIENT CENTER TRANSITIONS
            window.setSearchActive = function(active) {
                const next = !!active;
                if (searchModeActive === next) return;
                searchModeActive = next;
                applyTargetPresentation();
            };

            window.setAmbientCentered = function(centered) {
                const next = !!centered;
                if (ambientCentered === next) return;
                ambientCentered = next;
                if (!searchModeActive) {
                    applyTargetPresentation();
                }
            };

            // 8C. ZOOM IN / ZOOM OUT CONTROLS
            window.applyZoomDelta = function(factor) {
                userZoom = Math.max(0.4, Math.min(1.85, userZoom * factor));
                wakeLoop(1000);
            };

            window.resetZoom = function() {
                userZoom = 1.0;
                wakeLoop(searchModeActive ? 520 : 700);
            };

            // 9. RAYCASTING: TRIGGER WAVE AT EXACT TOUCH COORDINATES
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            window.triggerWaveAt = function(normX, normY) {
                wakeLoop(3000);
                let ndcX, ndcY;
                if (normX <= 1.0 && normY <= 1.0 && normX >= 0.0 && normY >= 0.0) {
                    ndcX = normX * 2.0 - 1.0;
                    ndcY = -(normY * 2.0 - 1.0);
                } else {
                    ndcX = (normX / window.innerWidth) * 2.0 - 1.0;
                    ndcY = -(normY / window.innerHeight) * 2.0 + 1.0;
                }
                raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);

                const worldCenter = globeGroup.position.clone();
                const worldRadius = radius * globeGroup.scale.x;
                const sphere = new THREE.Sphere(worldCenter, worldRadius);
                const hitPoint = new THREE.Vector3();

                if (raycaster.ray.intersectSphere(sphere, hitPoint)) {
                    const localHit = globeGroup.worldToLocal(hitPoint.clone()).normalize();
                    if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function') {
                        geodesicPulse.triggerPulse(localHit, null, 2.8);
                    }
                } else {
                    const ray = raycaster.ray;
                    const toCenter = worldCenter.clone().sub(ray.origin);
                    const projectionDistance = toCenter.dot(ray.direction);
                    if (projectionDistance > 0) {
                        const closestOnRay = ray.origin.clone().add(ray.direction.clone().multiplyScalar(projectionDistance));
                        const dirFromCenter = closestOnRay.sub(worldCenter).normalize();
                        const surfacePoint = worldCenter.clone().add(dirFromCenter.multiplyScalar(worldRadius));
                        const localHit = globeGroup.worldToLocal(surfacePoint).normalize();
                        if (geodesicPulse && typeof geodesicPulse.triggerPulse === 'function') {
                            geodesicPulse.triggerPulse(localHit, null, 2.8);
                        }
                    }
                }
            };

            // 10. INTERACTIVE TOUCH ROTATION WITH MOMENTUM & TWO-FINGER PINCH ZOOM
            let rotVelocity = { x: 0, y: 0 };
            window.rotateGlobe = function(dx, dy) {
                globeGroup.rotation.y += dx * 0.005;
                globeGroup.rotation.x = Math.max(-0.6, Math.min(0.6, globeGroup.rotation.x + dy * 0.003));
                rotVelocity.x = dx * 0.003;
                rotVelocity.y = dy * 0.0015;
                wakeLoop(1200);
            };

            let isDragging = false;
            let lastPos = { x: 0, y: 0 };
            let initialPinchDist = 0;

            function onTouchStart(e) {
                wakeLoop(1200);
                if (e.touches && e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    return;
                }
                isDragging = true;
                const touch = e.touches ? e.touches[0] : e;
                lastPos = { x: touch.clientX, y: touch.clientY };
                rotVelocity = { x: 0, y: 0 };
            }

            function onTouchMove(e) {
                if (e.touches && e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (initialPinchDist > 0) {
                        const factor = dist / initialPinchDist;
                        window.applyZoomDelta(1 + (factor - 1) * 0.5);
                        initialPinchDist = dist;
                    }
                    return;
                }
                if (!isDragging) return;
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - lastPos.x;
                const dy = touch.clientY - lastPos.y;
                lastPos = { x: touch.clientX, y: touch.clientY };
                window.rotateGlobe(dx, dy);
            }

            function onTouchEnd() {
                isDragging = false;
                initialPinchDist = 0;
            }

            canvas.addEventListener('mousedown', onTouchStart);
            window.addEventListener('mousemove', onTouchMove);
            window.addEventListener('mouseup', onTouchEnd);
            canvas.addEventListener('touchstart', onTouchStart, { passive: true });
            window.addEventListener('touchmove', onTouchMove, { passive: true });
            window.addEventListener('touchend', onTouchEnd);

            // 11. Adaptive Animation Loop (Full 90/120Hz on motion/waves; true 30fps timer idle; paused behind console blur)
            function animate(now) {
                rafId = null;
                if (isPageHidden) {
                    return;
                }

                const rawNow = typeof now === 'number' ? now : performance.now();
                const scaleGap = Math.abs(targetScale - currentScale);
                const posGap = Math.abs(targetPosY - currentPosY);
                const zoomGap = ambientCentered ? Math.abs(1.0 - userZoom) : 0;
                const rotGap = searchModeActive
                    ? Math.abs(targetRotY - globeGroup.rotation.y) + Math.abs(targetRotX - globeGroup.rotation.x)
                    : 0;
                const hasInertia = !searchModeActive && (Math.abs(rotVelocity.x) > 0.0001 || Math.abs(rotVelocity.y) > 0.0001);
                const hasActiveMotion = isDragging || hasInertia || scaleGap > 0.0008 || posGap > 0.04 || zoomGap > 0.001 || rotGap > 0.002 || rawNow < activeUntilMs;

                if (searchModeActive && !hasActiveMotion) {
                    return;
                }

                if (!hasActiveMotion) {
                    const sinceLast = rawNow - lastRenderMs;
                    if (sinceLast < 32) {
                        scheduleNextFrame(Math.ceil(32 - sinceLast));
                        return;
                    }
                }

                const dt = Math.min(Math.max((rawNow - lastRenderMs) * 0.001, 0.001), 0.08);
                lastRenderMs = rawNow;
                elapsed += dt;

                const step60 = Math.max(0.25, Math.min(dt * 60, 2.0));
                const lerpT = 1 - Math.pow(0.925, step60);
                currentScale = THREE.MathUtils.lerp(currentScale, targetScale, lerpT);
                currentPosY = THREE.MathUtils.lerp(currentPosY, targetPosY, lerpT);
                if (ambientCentered && Math.abs(1.0 - userZoom) > 0.001) {
                    userZoom = THREE.MathUtils.lerp(userZoom, 1.0, lerpT);
                    if (Math.abs(1.0 - userZoom) <= 0.001) userZoom = 1.0;
                }

                const effectiveScale = currentScale * userZoom;
                globeGroup.scale.set(effectiveScale, effectiveScale, effectiveScale);
                globeGroup.position.set(0, currentPosY, 0);

                if (searchModeActive) {
                    const searchT = 1 - Math.pow(0.92, step60);
                    globeGroup.rotation.y = THREE.MathUtils.lerp(globeGroup.rotation.y, targetRotY, searchT);
                    globeGroup.rotation.x = THREE.MathUtils.lerp(globeGroup.rotation.x, targetRotX, searchT);
                } else {
                    if (Math.abs(rotVelocity.x) > 0.0001 || Math.abs(rotVelocity.y) > 0.0001) {
                        globeGroup.rotation.y += rotVelocity.x * step60;
                        globeGroup.rotation.x = Math.max(-0.6, Math.min(0.6, globeGroup.rotation.x + rotVelocity.y * step60));
                        const decay = Math.pow(0.91, step60);
                        rotVelocity.x *= decay;
                        rotVelocity.y *= decay;
                        if (Math.abs(rotVelocity.x) <= 0.0001) rotVelocity.x = 0;
                        if (Math.abs(rotVelocity.y) <= 0.0001) rotVelocity.y = 0;
                    } else if (!isDragging) {
                        globeGroup.rotation.y += dt * 0.035;
                    }
                }

                // Update sub-systems
                if (userLocation && typeof userLocation.update === 'function') userLocation.update(elapsed);
                if (geodesicPulse && typeof geodesicPulse.update === 'function') geodesicPulse.update(elapsed);
                if (solarTerminator && typeof solarTerminator.update === 'function') solarTerminator.update(elapsed);
                if (nodes && typeof nodes.update === 'function') nodes.update(elapsed);

                renderer.render(scene, camera);

                const keepFast = isDragging ||
                    (!searchModeActive && (Math.abs(rotVelocity.x) > 0.0001 || Math.abs(rotVelocity.y) > 0.0001)) ||
                    Math.abs(targetScale - currentScale) > 0.0008 ||
                    Math.abs(targetPosY - currentPosY) > 0.04 ||
                    (ambientCentered && Math.abs(1.0 - userZoom) > 0.001) ||
                    (searchModeActive && (Math.abs(targetRotY - globeGroup.rotation.y) + Math.abs(targetRotX - globeGroup.rotation.x)) > 0.002) ||
                    performance.now() < activeUntilMs;
                if (searchModeActive && !keepFast) {
                    return;
                }
                scheduleNextFrame(keepFast ? 0 : 32);
            }

            if (typeof document !== 'undefined') {
                document.addEventListener('visibilitychange', () => {
                    isPageHidden = document.hidden;
                    if (isPageHidden) {
                        if (rafId) {
                            cancelAnimationFrame(rafId);
                            rafId = null;
                        }
                        if (idleTimerId) {
                            clearTimeout(idleTimerId);
                            idleTimerId = null;
                        }
                    } else {
                        wakeLoop(800);
                    }
                });
            }

            wakeLoop(1400);
        });
    </script>
</body>
</html>
